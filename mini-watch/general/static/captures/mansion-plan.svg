<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<rect width="1400" height="1000" fill="#f5f1e8"/>
<style>text{font-family:Arial,sans-serif;fill:#25231f} .t{font-weight:bold;font-size:24px}.s{font-size:16px}.xs{font-size:13px}.o{fill:#fffaf0;stroke:#493f35;stroke-width:3}.e{fill:#d9ecf4;stroke:#247a9b;stroke-width:3}.st{fill:#ead8b7;stroke:#8a5b2b;stroke-width:3}.p{fill:#ead6ef;stroke:#8b3e8d;stroke-width:3;stroke-dasharray:8 6}.r{fill:none;stroke:#8b3e8d;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#a)} .w{stroke:#493f35;stroke-width:3;fill:none}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#8b3e8d"/></marker></defs>
<text x="50" y="45" class="t">대저택 내부 구성도 · B1 ~ 3F</text>
<!-- 3D cutaway -->
<text x="50" y="90" class="t">입체도</text>
<polygon class="o" points="50,140 500,140 650,70 200,70"/><polygon class="o" points="500,140 650,70 650,550 500,630"/>
<path class="w" d="M50 140V630H500V140M200 70V550M650 70V550"/>
<polygon class="o" points="50,260 500,260 650,190 200,190"/><polygon class="o" points="50,380 500,380 650,310 200,310"/><polygon class="o" points="50,505 500,505 650,435 200,435"/>
<polygon class="e" points="205,100 275,100 305,85 235,85 235,560 205,575"/><text x="215" y="330" transform="rotate(-90 215 330)" class="s">엘리베이터 B1↔3F</text>
<polygon class="st" points="315,465 445,465 505,435 375,435 420,390 340,390 285,420"/><text x="320" y="490" class="xs">중앙계단 1F→2F</text>
<polygon class="st" points="525,300 590,266 590,215 625,195 625,275 560,310"/><rect class="p" x="575" y="150" width="55" height="55"/><text x="520" y="135" class="xs">2F 계단 위 문</text>
<rect class="p" x="505" y="335" width="145" height="90"/><text x="520" y="375" class="s">이집트 퍼즐</text><text x="525" y="397" class="xs">별도 차원</text><path class="r" d="M605 180C690 180 700 300 620 335"/><path class="r" d="M575 335C560 280 540 240 515 200"/>
<text x="75" y="220" class="s">3F 비밀층</text><text x="75" y="345" class="s">2F 갤러리</text><text x="75" y="465" class="s">1F 그랜드 홀</text><text x="75" y="590" class="s">B1 지하</text>
<!-- plans -->
<text x="760" y="90" class="t">평면도</text>
<g transform="translate(760 110)"><text x="0" y="0" class="t">B1</text><rect class="o" x="0" y="20" width="280" height="155"/><rect class="e" x="205" y="35" width="55" height="45"/><text x="210" y="63" class="xs">승강기</text><rect class="o" x="15" y="35" width="80" height="110"/><text x="30" y="95" class="xs">기계실</text><rect class="o" x="105" y="35" width="85" height="110"/><text x="120" y="95" class="xs">지하 회랑</text><text x="0" y="200" class="xs">설비·보관·비밀문서</text></g>
<g transform="translate(1080 110)"><text x="0" y="0" class="t">1F</text><rect class="o" x="0" y="20" width="280" height="155"/><rect class="st" x="75" y="50" width="130" height="95"/><text x="95" y="103" class="xs">중앙 대계단</text><rect class="o" x="15" y="35" width="50" height="45"/><text x="20" y="63" class="xs">응접</text><rect class="o" x="210" y="35" width="55" height="45"/><text x="222" y="63" class="xs">식당</text><rect class="e" x="210" y="95" width="55" height="45"/><text x="215" y="123" class="xs">승강기</text><text x="0" y="200" class="xs">현관·그랜드 홀·주방</text></g>
<g transform="translate(760 380)"><text x="0" y="0" class="t">2F</text><rect class="o" x="0" y="20" width="280" height="155"/><rect class="st" x="90" y="55" width="100" height="80"/><text x="105" y="100" class="xs">중앙계단 도착</text><rect class="st" x="210" y="35" width="55" height="80"/><text x="217" y="78" class="xs">상층계단</text><rect class="p" x="210" y="120" width="55" height="35"/><text x="219" y="142" class="xs">문</text><rect class="e" x="15" y="120" width="55" height="35"/><text x="20" y="142" class="xs">승강기</text><text x="0" y="200" class="xs">갤러리·침실·퍼즐 진입문</text></g>
<g transform="translate(1080 380)"><text x="0" y="0" class="t">퍼즐 공간 → 3F</text><rect class="p" x="0" y="20" width="280" height="155"/><rect class="p" x="15" y="70" width="50" height="55"/><text x="20" y="100" class="xs">2F 입구</text><circle class="p" cx="125" cy="98" r="35"/><text x="105" y="103" class="xs">아누비스</text><rect class="p" x="175" y="55" width="70" height="85"/><text x="187" y="103" class="xs">태양실</text><rect class="p" x="215" y="70" width="50" height="55"/><text x="220" y="103" class="xs">3F 출구</text><path class="r" d="M65 98H90M160 98H175M245 98H270"/><text x="0" y="200" class="xs">클리어 후 출구 문을 통해 3F 내부 공개</text></g>
<g transform="translate(760 650)"><text x="0" y="0" class="t">3F</text><rect class="o" x="0" y="20" width="600" height="220"/><rect class="o" x="15" y="35" width="240" height="190"/><text x="90" y="130" class="s">천문 관측실</text><rect class="o" x="270" y="35" width="150" height="85"/><text x="315" y="85" class="xs">유물실</text><rect class="o" x="270" y="140" width="150" height="85"/><text x="315" y="190" class="xs">주인의 방</text><rect class="e" x="450" y="165" width="130" height="60"/><text x="490" y="200" class="xs">엘리베이터</text><rect class="p" x="470" y="35" width="90" height="55"/><text x="480" y="68" class="xs">퍼즐 출구</text><path class="r" d="M515 90V140H420"/><text x="0" y="275" class="xs">처음에는 잠겨 있고, 퍼즐 클리어 후 내부가 보임</text></g>
</svg>
