<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<rect width="1200" height="850" fill="#f4f0e7"/>
<style>text{font-family:Arial,sans-serif;fill:#27231f}.title{font-size:28px;font-weight:bold}.label{font-size:18px;font-weight:bold}.small{font-size:14px}.house{fill:#fffaf0;stroke:#4b433b;stroke-width:3}.slab{fill:#eee5d4;stroke:#82786b;stroke-width:2}.shaft{fill:#cce7f2;stroke:#1c789c;stroke-width:4}.stairs{fill:#e8d3ae;stroke:#8a5a25;stroke-width:3}.door{fill:#e9c6d9;stroke:#9a3369;stroke-width:3}.dash{fill:none;stroke:#9a3369;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrow)}.step{stroke:#8a5a25;stroke-width:2}</style>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a3369"/></marker></defs>
<text x="50" y="55" class="title">대저택 수직 동선 입체도</text><text x="50" y="85" class="small">실내 공간은 생략하고, 엘리베이터와 계단·문만 표시</text>
<!-- building shell -->
<polygon class="house" points="120,170 760,170 930,90 290,90"/><polygon class="house" points="760,170 930,90 930,690 760,770"/><polygon class="house" points="120,170 760,170 760,770 120,770"/>
<!-- floor slabs -->
<polygon class="slab" points="120,320 760,320 930,240 290,240"/><polygon class="slab" points="120,470 760,470 930,390 290,390"/><polygon class="slab" points="120,620 760,620 930,540 290,540"/>
<text x="145" y="205" class="label">3F</text><text x="145" y="355" class="label">2F</text><text x="145" y="505" class="label">1F</text><text x="145" y="655" class="label">B1</text>
<!-- elevator shaft, long rectangular prism -->
<polygon class="shaft" points="285,145 385,145 420,128 320,128"/><polygon class="shaft" points="385,145 420,128 420,680 385,700"/><polygon class="shaft" points="285,145 385,145 385,700 285,720"/>
<line x1="285" y1="295" x2="385" y2="275" class="shaft"/><line x1="285" y1="445" x2="385" y2="425" class="shaft"/><line x1="285" y1="595" x2="385" y2="575" class="shaft"/>
<text x="295" y="420" transform="rotate(-90 295 420)" class="label">긴 직사각형 엘리베이터 샤프트 · B1↔1F↔2F↔3F</text>
<!-- elevator car -->
<polygon class="door" points="310,250 365,250 390,238 335,238"/><polygon class="door" points="365,250 390,238 390,300 365,312"/><polygon class="door" points="310,250 365,250 365,312 310,312"/><text x="302" y="330" class="small">승강기 카</text>
<!-- central stair 1F to 2F -->
<polygon class="stairs" points="470,565 690,565 755,535 535,535 625,455 490,455 425,500"/>
<g class="step"><line x1="460" y1="548" x2="680" y2="548"/><line x1="475" y1="530" x2="695" y2="530"/><line x1="490" y1="512" x2="710" y2="512"/><line x1="505" y1="494" x2="725" y2="494"/><line x1="520" y1="476" x2="640" y2="476"/></g>
<text x="470" y="600" class="label">중앙 계단</text><text x="450" y="625" class="small">1F → 2F</text>
<!-- stair 2F to door -->
<polygon class="stairs" points="760,360 850,320 850,250 900,225 900,335 810,375"/>
<g class="step"><line x1="778" y1="351" x2="850" y2="320"/><line x1="787" y1="333" x2="850" y2="306"/><line x1="796" y1="315" x2="850" y2="292"/><line x1="805" y1="297" x2="850" y2="278"/><line x1="814" y1="279" x2="850" y2="264"/></g>
<rect class="door" x="850" y="175" width="65" height="60" rx="4"/><text x="770" y="155" class="label">2F→3F 계단 위 문</text><text x="770" y="180" class="small">이 문을 통과하면 퍼즐 공간</text>
<path class="dash" d="M883 235C1000 240 1030 360 960 470"/><text x="945" y="500" class="small">퍼즐 공간으로 이동</text>
<!-- alignment callouts -->
<line x1="210" y1="735" x2="285" y2="700" stroke="#1c789c" stroke-width="2"/><text x="50" y="748" class="small">엘리베이터는 모든 층을 수직으로 관통</text>
<line x1="700" y1="660" x2="650" y2="570" stroke="#8a5a25" stroke-width="2"/><text x="705" y="670" class="small">중앙 계단은 1F와 2F만 연결</text>
</svg>
